<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL_VOID_v.6.6.6</title>
    <link rel="icon" href="IMG_0646.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --horror-red: #aa0000;
            --bg: #050000;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Special Elite', monospace;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            flex-direction: column;
        }

        /* Эффект помех */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://media.giphy.com/media/oEI9uWUic6pUeD704O/giphy.gif');
            opacity: 0.06;
            pointer-events: none;
            z-index: 100;
        }

        #tracker {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 12px;
            color: var(--horror-red);
            z-index: 101;
            letter-spacing: 2px;
        }

        .horror-ui {
            text-align: center;
            z-index: 10;
            opacity: 0; /* Изначально скрыто */
            transition: opacity 1s;
        }

        .main-title {
            font-size: 50px;
            color: #fff;
            text-shadow: 0 0 10px red;
            margin-bottom: 30px;
            animation: flicker 0.1s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.9; } 50% { opacity: 1; } 100% { opacity: 0.8; }
        }

        /* Проклятый архив */
        .archive {
            background: rgba(20, 0, 0, 0.6);
            border: 1px solid var(--horror-red);
            padding: 20px;
            max-width: 450px;
            text-align: left;
        }

        .file-item {
            padding: 8px;
            border-bottom: 1px solid rgba(255,0,0,0.2);
            cursor: pointer;
            font-size: 14px;
            color: #ffaaaa;
        }

        .file-item:hover {
            background: var(--horror-red);
            color: #000;
        }

        /* --- ИСПРАВЛЕННЫЙ СКРИМЕР --- */
        #scramer-img {
            display: none; /* Скрыт по умолчанию */
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover;
            z-index: 999;
            /* Фильтры: делаем фото четким, но мрачным */
            filter: contrast(2.5) brightness(0.7) grayscale(0.5); 
        }

        /* Анимация при скримере: еле заметная вибрация + пульсация красным */
        .scramer-active {
            animation: screamVibrate 0.1s infinite, screamPulse 0.3s infinite;
        }

        /* Вибрация: смещение всего на 1px, чтобы сохранить четкость */
        @keyframes screamVibrate {
            0% { transform: translate(1px, 1px); }
            50% { transform: translate(-1px, -1px); }
            100% { transform: translate(1px, -1px); }
        }

        /* Пульсация: резкое тонирование в красный для агрессии */
        @keyframes screamPulse {
            0% { filter: contrast(2.5) brightness(0.7) grayscale(0.5); }
            50% { filter: contrast(3) brightness(0.6) sepia(1) hue-rotate(-50deg) saturate(5); }
            100% { filter: contrast(2.5) brightness(0.7) grayscale(0.5); }
        }
    </style>
</head>
<body id="main-body">

    <div id="tracker">TARGET_DIST: <span id="dist-val">CALCULATING...</span></div>

    <div class="horror-ui" id="ui">
        <h1 class="main-title">RESTRICTED_AREA</h1>
        
        <div class="archive">
            <div style="font-size: 10px; margin-bottom: 10px; color: var(--horror-red);">// CURRUPTED_FILES_FOUND:</div>
            <div class="file-item" onclick="accessError('ERR_FILE_NOT_FOUND_IN_REALITY')">📄 project_history.log</div>
            <div class="file-item" onclick="accessError('UNAUTHORIZED_EYES_DETECTED')">📄 team_souls.db</div>
            <div class="file-item" onclick="accessError('666_FATAL_ERROR')">📄 secret_m4_render.png</div>
            <div class="file-item" onclick="window.location.href='main.html'">📄 EXIT_SURFACE.exe</div>
        </div>
    </div>

    <img src="https://avatars.mds.yandex.net/i?id=9293c28fbef82ff14c5b24b1f50cf6cd57db3c81-4797663-images-thumbs&n=13" id="scramer-img">

    <script>
        const roll = Math.random();
        const body = document.getElementById("main-body");
        const ui = document.getElementById("ui");
        const img = document.getElementById("scramer-img");
        const distVal = document.getElementById("dist-val");

        // Функция ошибок для архива
        function accessError(msg) {
            alert("CRITICAL_SYSTEM_FAILURE: " + msg + "\n\nОНИ ЗНАЮТ, ЧТО ТЫ ЗДЕСЬ.");
        }

        // Трекер "дистанции" (Паранойя)
        document.addEventListener('mousemove', (e) => {
            let x = Math.abs(window.innerWidth/2 - e.pageX);
            let y = Math.abs(window.innerHeight/2 - e.pageY);
            let dist = Math.floor(Math.sqrt(x*x + y*y));
            distVal.innerText = dist + "m";
            distVal.style.color = dist < 200 ? "#fff" : "#aa0000";
        });

        if (roll < 0.5) {
            // ВАРИАНТ: ТИХИЙ УЖАС
            setTimeout(() => { ui.style.opacity = '1'; }, 1000);
            setTimeout(() => { alert("ОБЕРНИСЬ."); }, 12000);
        } else {
            // ВАРИАНТ: СКРИМЕР
            setTimeout(() => {
                // Активируем класс с вибрацией и пульсацией
                img.classList.add("scramer-active");
                img.style.display = 'block';
                
                try {
                    let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    // Частоту звука сделали чуть ниже (2000 вместо 2500), чтобы он был "басистее" и страшнее
                    osc.frequency.setValueAtTime(2000, audioCtx.currentTime);
                    gain.gain.setValueAtTime(1, audioCtx.currentTime);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start();
                    setTimeout(() => { osc.stop(); window.location.href = "main.html"; }, 1600);
                } catch(e) { setTimeout(() => { window.location.href = "main.html"; }, 1600); }
            }, 1200);
        }
    </script>
</body>
</html>
